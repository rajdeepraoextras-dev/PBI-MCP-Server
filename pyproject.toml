[project]
name = "pbi-mcp"
version = "2.0.1"
description = "MCP server for local-file Power BI Project (.pbip) automation — model (TMDL) + report (PBIR) layers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rajdeep Rao" }]
dependencies = [
    "mcp>=1.2.0,<3",  # 1.x (FastMCP) and 2.x (MCPServer) both supported, see core/mcp_compat.py
    "pydantic>=2.6",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.0",
]
docs = [
    "mkdocs-material>=9",
]

[project.scripts]
pbi-model-server = "model_server.server:main"
pbi-report-server = "report_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "model_server", "report_server"]

[tool.setuptools.package-data]
"*" = ["resources/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
