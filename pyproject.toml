[project]
name = "pbi-mcp"
version = "2.0.1"
description = "MCP server for local-file Power BI Project (.pbip) automation — model (TMDL) + report (PBIR) layers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rajdeep Rao" }]
keywords = [
    "power-bi", "powerbi", "pbip", "pbir", "tmdl", "dax", "semantic-model",
    "report", "dashboard", "mcp", "model-context-protocol", "claude",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.2.0,<3",  # 1.x (FastMCP) and 2.x (MCPServer) both supported, see core/mcp_compat.py
    "pydantic>=2.6",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.0",
]
cloud = [
    "msal>=1.28",  # optional: service-principal / device-code sign-in for pbi-service
]
docs = [
    "mkdocs-material>=9",
]
render = [
    "Pillow>=10",
]

[project.scripts]
pbi-mcp = "core.cli:main"
pbi-model-server = "model_server.server:main"
pbi-report-server = "report_server.server:main"
pbi-service-server = "service_server.server:main"

[project.urls]
Homepage = "https://github.com/rajdeepraoextras-dev/PBI-MCP-Server"
Repository = "https://github.com/rajdeepraoextras-dev/PBI-MCP-Server"
Issues = "https://github.com/rajdeepraoextras-dev/PBI-MCP-Server/issues"
Changelog = "https://github.com/rajdeepraoextras-dev/PBI-MCP-Server/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# `find` (not an explicit list) so the optional service_server package is
# picked up when present and silently skipped when absent. `namespaces = true`
# lets the data-only `resources/schemas` directory (no __init__.py) ship inside
# the wheel: core/schema_validate.py resolves it as <site-packages>/resources/
# schemas, two levels above core/, exactly like the source checkout.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "core", "core.*",
    "model_server", "model_server.*",
    "report_server", "report_server.*",
    "service_server", "service_server.*",
    "resources", "resources.schemas",
]
exclude = ["*__pycache__*"]
namespaces = true

[tool.setuptools.package-data]
"resources.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
