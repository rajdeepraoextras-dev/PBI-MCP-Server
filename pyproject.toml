[project]
name = "pbi-mcp"
version = "1.0.0"
description = "MCP server for local-file Power BI Project (.pbip) automation — model (TMDL) + report (PBIR) layers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rajdeep Rao" }]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pbi-model-server = "model_server.server:main"
pbi-report-server = "report_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "model_server", "report_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
