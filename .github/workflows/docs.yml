name: Docs

# Builds the GitHub Pages site: the landing page from website/ at the root
# and the mkdocs documentation under /docs/. Pull requests only build and
# check that the generated data is current; pushes to main deploy through
# the GitHub Pages actions (repository setting: Pages > Source > GitHub
# Actions, set once). See docs/development.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
      # Pull requests must commit current generated data (the test suite
      # checks this too); on main the deploy regenerates it instead of blocking.
      - name: Generated tool reference and site data are current
        if: github.event_name == 'pull_request'
        run: |
          python scripts/gen_tool_reference.py --check
          python scripts/gen_site_assets.py --check
      - name: Regenerate on main
        if: github.event_name != 'pull_request'
        run: |
          python scripts/gen_tool_reference.py
          python scripts/gen_site_assets.py
      - name: Assemble the site (landing page at /, docs at /docs/)
        run: |
          rm -rf _site && mkdir -p _site
          cp -r website/. _site/
          mkdocs build --strict --site-dir _site/docs
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # verify the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
