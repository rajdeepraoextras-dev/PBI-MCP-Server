name: Publish to PyPI

# Runs when a version tag is pushed (git tag vX.Y.Z && git push --tags).
# Uses PyPI trusted publishing (OIDC): no API token or secret is stored
# anywhere. One-time setup is described in CONTRIBUTING.md ("Releasing").

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        run: |
          python - <<'PY'
          import os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          assert tag == version, f"tag {tag!r} does not match pyproject version {version!r}"
          print("releasing", version)
          PY
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir pkg
          twine check --strict pkg/*
      # PyPI versions are immutable, so prove the wheel works before uploading.
      - name: Smoke-test the wheel in a clean venv
        run: |
          WHEEL="$(ls "$PWD"/pkg/*.whl)"
          python -m venv "$RUNNER_TEMP/whl"
          "$RUNNER_TEMP/whl/bin/pip" install -q "$WHEEL"
          cd "$RUNNER_TEMP"   # away from the checkout so `core` resolves to the wheel
          "$RUNNER_TEMP/whl/bin/pbi-mcp" --version
          "$RUNNER_TEMP/whl/bin/python" - <<'PY'
          from core.pbir import build_page_json
          from core import schema_validate as sv
          assert sv.validate("page", build_page_json("p", "P", 1280, 720)) == []
          print("installed wheel validates against the vendored schemas")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: pkg/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pbi-mcp/
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: pkg
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkg/
